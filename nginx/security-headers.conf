# =============================================================================
# security-headers.conf
# DokployPress — Shared security headers snippet
#
# nginx only inherits add_header from a parent block when the location block
# itself has none of its own — any location that sets its own add_header
# (e.g. Cache-Control on static assets, Content-Type on /healthz) silently
# drops these unless it explicitly includes this file too. See
# default.conf.template for where this is included.
#
# @package DokployPress
# @since   3.0.0
# =============================================================================

add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
