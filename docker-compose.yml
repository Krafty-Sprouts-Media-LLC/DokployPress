# =============================================================================
# docker-compose.yml
# DokployPress — Main Docker Compose stack definition
# Unofficial WordPress stack for Dokploy — by Krafty Sprouts Media.
# Not affiliated with or endorsed by Dokploy.
#
# Services: nginx, wordpress, db (MariaDB), redis, plugin-installer,
#           phpmyadmin, wp-cron, action-scheduler, sftp (optional, tools profile)
#
# @package DokployPress
# @since   1.0.0
# =============================================================================

services:
  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    ports:
      - "80"
    environment:
      - NGINX_CLIENT_MAX_BODY_SIZE=${NGINX_CLIENT_MAX_BODY_SIZE:-256M}
      - NGINX_FASTCGI_TIMEOUT=${NGINX_FASTCGI_TIMEOUT:-300}
    volumes:
      - wordpress_data:/var/www/html:ro
    depends_on:
      wordpress:
        condition: service_healthy
    networks:
      - dokploy-network
      - internal
    deploy:
      resources:
        limits:
          cpus: "${NGINX_CPU_LIMIT:-0.5}"
          memory: "${NGINX_MEMORY_LIMIT:-256M}"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  wordpress:
    build:
      context: ./wordpress
      dockerfile: Dockerfile
    # Forwards every KEY=VALUE set in Dokploy's Environment tab straight into
    # this container's process env — lets theme/plugin-specific vars (e.g. a
    # GitHub update-checker token) work via getenv() with no compose edit or
    # redeploy of this stack's images. required: false so local/CI runs
    # without a .env file (see tests/smoke-test.env) still work.
    env_file:
      - path: .env
        required: false
    environment:
      - WORDPRESS_DB_HOST=${WORDPRESS_DB_HOST:-db}
      - WORDPRESS_DB_USER=${WORDPRESS_DB_USER:-wordpress}
      - WORDPRESS_DB_PASSWORD=${WORDPRESS_DB_PASSWORD}
      - WORDPRESS_DB_NAME=${WORDPRESS_DB_NAME:-wordpress}
      - WORDPRESS_PUBLIC_URL=${WORDPRESS_PUBLIC_URL:-}
      - WORDPRESS_MULTISITE_CONFIG=${WORDPRESS_MULTISITE_CONFIG:-}
      # Arbitrary define()/wp-config constants, synced into wp-config.php on
      # every container start (unlike WORDPRESS_CONFIG_EXTRA below, which
      # only the base image writes, and only on a fresh install). Use this
      # for plugin/theme constants (e.g. an encryption key) that must reach
      # already-provisioned sites without SSH.
      - WORDPRESS_CONFIG_EXTRA_PERSISTENT=${WORDPRESS_CONFIG_EXTRA_PERSISTENT:-}
      - WORDPRESS_CONFIG_EXTRA=
          define('WP_REDIS_HOST', 'redis');
          define('WP_REDIS_PORT', 6379);
          define('WP_CACHE', true);
          define('MC_STORAGE_HOST', 'redis');
          define('MC_STORAGE_PORT', 6379);
          define('MC_STORAGE_DB', 1);
          define('DISABLE_WP_CRON', true);
      # PHP Settings
      - PHP_UPLOAD_MAX_FILESIZE=${PHP_UPLOAD_MAX_FILESIZE:-256M}
      - PHP_POST_MAX_SIZE=${PHP_POST_MAX_SIZE:-256M}
      - PHP_MEMORY_LIMIT=${PHP_MEMORY_LIMIT:-384M}
      - PHP_MAX_EXECUTION_TIME=${PHP_MAX_EXECUTION_TIME:-300}
      - PHP_MAX_INPUT_TIME=${PHP_MAX_INPUT_TIME:-300}
      - PHP_MAX_INPUT_VARS=${PHP_MAX_INPUT_VARS:-3000}
      # OPcache Settings
      - PHP_OPCACHE_MEMORY=${PHP_OPCACHE_MEMORY:-128}
      - PHP_OPCACHE_MAX_FILES=${PHP_OPCACHE_MAX_FILES:-4000}
      - PHP_OPCACHE_VALIDATE=${PHP_OPCACHE_VALIDATE:-1}
      # Multisite — set to 'subfolder' or 'subdomain' to enable Network Setup.
      # Leave as 'disabled' for standard single-site installs.
      - WP_MULTISITE_MODE=${WP_MULTISITE_MODE:-disabled}
    volumes:
      - wordpress_data:/var/www/html
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - internal
    deploy:
      resources:
        limits:
          cpus: "${WORDPRESS_CPU_LIMIT:-1.0}"
          memory: "${WORDPRESS_MEMORY_LIMIT:-1G}"
    healthcheck:
      test: ["CMD-SHELL", "php-fpm-healthcheck || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # One-shot pre-upgrade safety net for the MariaDB 10.6 → 11.8 jump. Snapshots
  # the datadir to db_backup BEFORE 11.8 ever opens an existing 10.6 volume —
  # this is a one-time upgrade safety net, not a recurring backup solution.
  # No-ops on fresh installs and on volumes already upgraded to 11.x. Extra
  # disk usage is roughly the datadir size, compressed — safe to delete the
  # tarball from db_backup once the upgrade is verified.
  # See docs/hosting-guide.md "Upgrading the database" for the restore steps.
  # ---------------------------------------------------------------------------
  db-preupgrade-snapshot:
    image: alpine:3
    command:
      - /bin/sh
      - -c
      - |
        set -eu
        DATADIR=/var/lib/mysql
        BACKUP_DIR=/backup
        MARKER_FILE="$${DATADIR}/mysql_upgrade_info"

        if [ ! -f "$${DATADIR}/ibdata1" ]; then
          echo "[db-preupgrade-snapshot] Fresh install — nothing to snapshot."
          exit 0
        fi

        if [ ! -f "$${MARKER_FILE}" ]; then
          echo "[db-preupgrade-snapshot] No mysql_upgrade_info marker — cannot determine prior version, skipping."
          exit 0
        fi

        CURRENT_VERSION=$(head -1 "$${MARKER_FILE}")

        case "$${CURRENT_VERSION}" in
          11.*)
            echo "[db-preupgrade-snapshot] Datadir already on $${CURRENT_VERSION} — no-op."
            exit 0
            ;;
        esac

        SAFE_VERSION=$(echo "$${CURRENT_VERSION}" | tr -c 'a-zA-Z0-9._-' '_')

        if ls "$${BACKUP_DIR}"/preupgrade-"$${SAFE_VERSION}"-*.tar.gz >/dev/null 2>&1; then
          echo "[db-preupgrade-snapshot] Snapshot for $${CURRENT_VERSION} already exists — no-op."
          exit 0
        fi

        echo "[db-preupgrade-snapshot] Pre-11.x datadir ($${CURRENT_VERSION}) detected — snapshotting before MariaDB 11.8 opens it..."
        mkdir -p "$${BACKUP_DIR}"
        SNAPSHOT_NAME="preupgrade-$${SAFE_VERSION}-$(date +%Y%m%d%H%M%S).tar.gz"
        tar -czf "$${BACKUP_DIR}/$${SNAPSHOT_NAME}" -C "$${DATADIR}" .
        echo "[db-preupgrade-snapshot] Snapshot written to $${BACKUP_DIR}/$${SNAPSHOT_NAME}"
    volumes:
      - db_data:/var/lib/mysql
      - db_backup:/backup
    networks:
      - internal
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: "128M"
      restart_policy:
        condition: on-failure
        max_attempts: 3

  db:
    image: mariadb:11.8
    depends_on:
      db-preupgrade-snapshot:
        condition: service_completed_successfully
    environment:
      - MARIADB_AUTO_UPGRADE=1
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - MYSQL_DATABASE=${MYSQL_DATABASE:-wordpress}
      - MYSQL_USER=${MYSQL_USER:-wordpress}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - internal
    deploy:
      resources:
        limits:
          cpus: "${DB_CPU_LIMIT:-1.0}"
          memory: "${DB_MEMORY_LIMIT:-1G}"
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: unless-stopped

  redis:
    image: redis:8-alpine
    command: redis-server --maxmemory ${REDIS_MAXMEMORY:-512mb} --maxmemory-policy ${REDIS_MAXMEMORY_POLICY:-allkeys-lru}
    volumes:
      - redis_data:/data
    networks:
      - internal
    deploy:
      resources:
        limits:
          cpus: "${REDIS_CPU_LIMIT:-0.5}"
          memory: "${REDIS_MEMORY_LIMIT:-512M}"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  plugin-installer:
    build:
      context: ./plugin-installer
      dockerfile: Dockerfile
    volumes:
      - wordpress_data:/var/www/html
    depends_on:
      wordpress:
        condition: service_healthy
    networks:
      - internal
    deploy:
      resources:
        limits:
          cpus: "${INSTALLER_CPU_LIMIT:-0.25}"
          memory: "${INSTALLER_MEMORY_LIMIT:-128M}"
      restart_policy:
        condition: on-failure
        max_attempts: 3

  # Optional — enable with COMPOSE_PROFILES=tools in Dokploy Environment,
  # same as the sftp service below. Runs 24/7 attached to dokploy-network
  # (Traefik-reachable) when enabled, so it's opt-in rather than always-on.
  phpmyadmin:
    profiles:
      - tools
    image: phpmyadmin/phpmyadmin:5
    environment:
      - PMA_HOST=db
      - PMA_PORT=3306
      - UPLOAD_LIMIT=${PMA_UPLOAD_LIMIT:-256M}
    ports:
      - "80"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - dokploy-network
      - internal
    deploy:
      resources:
        limits:
          cpus: "${PHPMYADMIN_CPU_LIMIT:-0.5}"
          memory: "${PHPMYADMIN_MEMORY_LIMIT:-256M}"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # WP-Cron sidecar — always-on. Triggers wp-cron.php every 5 minutes via
  # the internal Docker network so WP scheduled events run reliably without
  # relying on visitor traffic or exposing an external HTTP endpoint.
  # DISABLE_WP_CRON=true in wp-config prevents WordPress from spawning its
  # own pseudo-cron on page load, avoiding duplicate runs.
  # ---------------------------------------------------------------------------
  wp-cron:
    image: alpine:3
    command:
      - /bin/sh
      - -c
      - |
        echo 'WP-Cron sidecar started. Interval: 300s'
        while true; do
          if wget -q -O /dev/null 'http://nginx/wp-cron.php?doing_wp_cron' 2>&1; then
            echo "[$(date '+%Y-%m-%d %H:%M:%S')] wp-cron triggered"
          else
            echo "[$(date '+%Y-%m-%d %H:%M:%S')] wp-cron request failed (nginx may still be starting)"
          fi
          sleep "${WP_CRON_INTERVAL:-300}"
        done
    depends_on:
      nginx:
        condition: service_healthy
    networks:
      - internal
    deploy:
      resources:
        limits:
          cpus: "0.05"
          memory: "32M"
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Action Scheduler runner — runs `wp action-scheduler run` from the command
  # line every ACTION_SCHEDULER_INTERVAL seconds (default 60), as www-data.
  #
  # Action Scheduler is the background queue WooCommerce, Writura and many
  # other plugins use. Run through wp-cron.php (the wp-cron sidecar above) its
  # tasks share PHP-FPM's PHP_MAX_EXECUTION_TIME / NGINX_FASTCGI_TIMEOUT limits
  # and only get a turn every WP_CRON_INTERVAL; from the command line they have
  # no time limit and run every minute. Reuses the WordPress image, environment
  # and volume, but not its entrypoint: no php-fpm, and none of the
  # wp-config / migration fixes (those stay with the wordpress container).
  # Idles quietly until a plugin that uses Action Scheduler is active.
  # Action Scheduler lets one runner work at a time: when another runner (or a
  # long task) holds the batch, this logs "Queue busy" once and tries again.
  # Keep this the only command-line runner (no extra Dokploy Schedule).
  # Set ACTION_SCHEDULER_RUNNER=disabled to turn it off.
  # ---------------------------------------------------------------------------
  action-scheduler:
    extends:
      service: wordpress
    user: www-data
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        if [ "${ACTION_SCHEDULER_RUNNER:-enabled}" = "disabled" ]; then
          echo 'Action Scheduler runner disabled (ACTION_SCHEDULER_RUNNER=disabled).'
          exec sleep infinity
        fi
        export WP_CLI_CACHE_DIR=/tmp/wp-cli-cache
        WP="php -d memory_limit=${PHP_MEMORY_LIMIT:-384M} /usr/local/bin/wp --path=/var/www/html"
        echo 'Action Scheduler runner started. Interval: ${ACTION_SCHEDULER_INTERVAL:-60}s'
        ready=""
        waiting=""
        busy=""
        while true; do
          if [ -z "$$ready" ]; then
            if $$WP cli has-command "action-scheduler run" >/dev/null 2>&1; then
              ready=1
              waiting=""
              echo "[$(date '+%Y-%m-%d %H:%M:%S')] Action Scheduler found — running the queue every ${ACTION_SCHEDULER_INTERVAL:-60}s"
            elif [ -z "$$waiting" ]; then
              waiting=1
              echo "[$(date '+%Y-%m-%d %H:%M:%S')] Waiting for WordPress and a plugin that uses Action Scheduler"
            fi
          fi
          if [ -n "$$ready" ]; then
            if output=$$($$WP action-scheduler run --quiet 2>&1); then
              if [ -n "$$busy" ]; then
                echo "[$(date '+%Y-%m-%d %H:%M:%S')] Queue free again"
              fi
              busy=""
            else
              case "$$output" in
                *"too many concurrent batches"*)
                  # Another runner (or a long task) holds Action Scheduler's batch: normal, try next time.
                  if [ -z "$$busy" ]; then
                    busy=1
                    echo "[$(date '+%Y-%m-%d %H:%M:%S')] Queue busy — another runner or a long task is working; waiting"
                  fi
                  ;;
                *)
                  busy=""
                  echo "$$output"
                  echo "[$(date '+%Y-%m-%d %H:%M:%S')] action-scheduler run failed — will check again"
                  ready=""
                  ;;
              esac
            fi
          fi
          sleep "${ACTION_SCHEDULER_INTERVAL:-60}"
        done
    depends_on:
      wordpress:
        condition: service_healthy
    healthcheck:
      disable: true
    deploy:
      resources:
        limits:
          cpus: "${ACTION_SCHEDULER_CPU_LIMIT:-0.5}"
          memory: "${ACTION_SCHEDULER_MEMORY_LIMIT:-512M}"
    restart: unless-stopped

  # Optional — enable with COMPOSE_PROFILES=tools in Dokploy Environment.
  # Mounts the same wordpress_data volume as WordPress (internal container path only).
  sftp:
    profiles:
      - tools
    # atmoz/sftp has no numbered release tags on Docker Hub — :alpine is the
    # only non-"latest" channel it publishes. Pinned here to stay off the
    # floating "latest" tag per this project's pinning policy (see
    # IMPLEMENTATION_PLAN.md, Task 1).
    image: atmoz/sftp:alpine
    # No default password (was the guessable "changeme_set_in_dokploy" —
    # see IMPLEMENTATION_PLAN.md, Task 4). A required-variable expansion
    # (${SFTP_PASSWORD:?...}) was tried and rejected: Compose interpolates
    # the whole file before profile filtering, so it broke every deploy,
    # not just ones using the tools profile — confirmed directly with
    # `docker compose config`, not just in theory. An empty SFTP_PASSWORD
    # makes atmoz/sftp create the account with a locked password (`*` in
    # /etc/shadow, confirmed directly) — no login is possible, safe by
    # default. The healthcheck below makes that failure loud (unhealthy in
    # Dokploy) instead of a silent "SFTP is up but nobody, including you,
    # can log in" state.
    command: "${SFTP_USER:-wpuser}:${SFTP_PASSWORD:-}:${SFTP_UID:-33}"
    environment:
      - SFTP_PASSWORD=${SFTP_PASSWORD:-}
    volumes:
      - wordpress_data:/home/${SFTP_USER:-wpuser}/public_html
    ports:
      - "${SFTP_PORT:-2222}:22"
    networks:
      - dokploy-network
    healthcheck:
      test: ["CMD-SHELL", "test -n \"$$SFTP_PASSWORD\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    deploy:
      resources:
        limits:
          cpus: "${SFTP_CPU_LIMIT:-0.25}"
          memory: "${SFTP_MEMORY_LIMIT:-128M}"
    restart: unless-stopped

networks:
  dokploy-network:
    external: true
  internal:
    driver: bridge

volumes:
  wordpress_data:
    name: ${STACK_SLUG:-${COMPOSE_PROJECT_NAME:-wordpress}}_data
  db_data:
    name: ${STACK_SLUG:-${COMPOSE_PROJECT_NAME:-wordpress}}_db_data
  redis_data:
    name: ${STACK_SLUG:-${COMPOSE_PROJECT_NAME:-wordpress}}_redis_data
  db_backup:
    name: ${STACK_SLUG:-${COMPOSE_PROJECT_NAME:-wordpress}}_db_backup
